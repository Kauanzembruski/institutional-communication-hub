{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">

    <title>Achados e Perdidos</title>


    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }

        header {
            background: #006414;
        }

        main {
            display: block !important;
            width: 100%;
            height: calc(100vh - 150px);
            padding: 35px 60px 110px 60px;
            overflow: hidden;
        }

        #itensContainer {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 30px;
            overflow: hidden;
        }


        /* =====================================================
           ITEM
        ===================================================== */

        #itensContainer .item {

            width: 100%;

            height: 100%;

            min-width: 0;

            min-height: 0;

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
           CARD DA IMAGEM
        ===================================================== */

        #itensContainer .card {

            width: 100%;

            flex: 1;

            min-height: 0;

            overflow: hidden;
        }


        /* =====================================================
           ARTICLE
        ===================================================== */

        #itensContainer article {

            width: 100%;

            height: 100%;

            border: 5px solid #006414;

            border-radius: 15px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding: 10px;

            box-sizing: border-box;
        }


        /* =====================================================
           IMAGEM
        ===================================================== */

        #itensContainer article img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: contain;

            background: #d3d3d3;

            border-radius: 5px;
        }


        /* =====================================================
           NOME DO ITEM
        ===================================================== */

        #itensContainer .item-titulo {

            flex-shrink: 0;

            height: 50px;

            margin: 8px 0 0 0;

            padding: 0 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            line-height: 1;

            color: #222;

            font-weight: bold;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           ITEM OCULTO
        ===================================================== */

        #itensContainer .item.oculto {
            display: none;
        }


        /* =====================================================
           MENSAGEM VAZIA
        ===================================================== */

        #itensContainer .vazio {

            grid-column: 1 / 3;

            grid-row: 1 / 3;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

            color: #222;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 900px) {

            main {
                padding: 25px;
            }

            #itensContainer {
                gap: 20px;
            }

            #itensContainer .item-titulo {
                font-size: 24px;
            }

        }
    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <img class="logo" src="{% static 'img/logoif.png.png' %}" alt="Logo IFRS">

        <h1>
            ACHADOS E PERDIDOS
        </h1>

    </header>



    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main>

        <div id="itensContainer">


            {% for item in itens %}


            <section class="item">


                <div class="card">

                    <article>


                        {% if item.imagem %}

                        <img src="{{ item.imagem.url }}" alt="{{ item.nome }}">

                        {% else %}

                        <img src="{% static 'img/GD_imgSemImagem.png' %}" alt="Sem imagem">

                        {% endif %}


                    </article>

                </div>


                <h2 class="item-titulo">

                    {{ item.nome }}

                </h2>


            </section>


            {% empty %}


            <h2 class="vazio">

                Nenhum item encontrado.

            </h2>


            {% endfor %}


        </div>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>




        let paginaAtual = 0;

        function rodarCarrossel() {
            const itens = document.querySelectorAll('main .item');
            const totalItens = itens.length;

            if (totalItens === 0) return;
            // Calcula o total de páginas necessárias (arredondado para cima)
            const totalPaginas = Math.ceil(totalItens / 2);
            // 1. Esconde absolutamente todos os itens
            itens.forEach(item => item.style.display = 'none');
            // 2. Descobre o índice dos dois itens da página atual
            const primeiroDaDupla = paginaAtual * 2;
            const segundoDaDupla = primeiroDaDupla + 1;
            // Mostra os itens se eles existirem
            if (itens[primeiroDaDupla]) { itens[primeiroDaDupla].style.display = 'flex'; }
            if (itens[segundoDaDupla]) { itens[segundoDaDupla].style.display = 'flex'; }
            // 3. Avança para a próxima página e reseta de forma limpa usando o operador resto (%)
            paginaAtual = (paginaAtual + 1) % totalPaginas;
        }
        // Executa ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            rodarCarrossel();
            // Troca a cada 20 segundos (conforme configurado no seu setInterval original)
            setInterval(rodarCarrossel, 4000);
        });

    </script>


</body>

</html>
