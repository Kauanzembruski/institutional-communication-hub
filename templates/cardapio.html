{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <title>Cardápio da Semana</title>

<style>

    /* =====================================================
       CABEÇALHO
    ===================================================== */

    header {
        background: #C15741;
    }


    /* =====================================================
       ÁREA DO CARDÁPIO
    ===================================================== */

    main#cardapio {
        width: 90%;
        margin: 60px auto 120px auto;

        display: block;
    }


    /* =====================================================
       GRID DOS CARDS
    ===================================================== */

    #cardapio .container {

        width: 100%;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        column-gap: 100px;

        row-gap: 30px;

        box-sizing: border-box;
    }


    /* =====================================================
       CARDS
    ===================================================== */

    #cardapio article {

        height: 215px;

        background: white;

        border: 5px solid #C15741;

        border-radius: 20px;

        position: relative;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        box-sizing: border-box;

        margin-top: 20px;
    }


    /* =====================================================
       DIA DA SEMANA
    ===================================================== */

    #cardapio article h3 {

        position: absolute;

        top: -28px;

        left: 50%;

        transform: translateX(-50%);

        width: 255px;

        height: 50px;

        margin: 0;

        padding: 0;

        background: white;

        border: 3px solid #C15741;

        display: flex;

        justify-content: center;

        align-items: center;

        text-align: center;

        font-size: 28px;

        font-weight: bold;

        color: #222;

        box-sizing: border-box;

        white-space: nowrap;
    }


    /* =====================================================
       LANCHE
    ===================================================== */

    #cardapio article p {

        margin: 0;

        padding: 20px;

        font-size: 36px;

        font-weight: bold;

        color: #222;

        text-align: center;

        line-height: 1.2;

        box-sizing: border-box;
    }


    /* =====================================================
       CASO NÃO TENHA CARDÁPIO
    ===================================================== */

    #cardapio .vazio {

        grid-column: 1 / 4;

        text-align: center;

        font-size: 30px;

        font-weight: bold;

        padding: 50px;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {

        position: fixed;

        bottom: 20px;

        left: 0;

        width: 100%;

        display: flex;

        align-items: center;

        gap: 25px;

        padding: 0 45px;

        box-sizing: border-box;

        z-index: 100;
    }


    /* =====================================================
       HORA
    ===================================================== */

    footer .hora {

        background: #f5f5f5;

        border: 3px solid #aaa;

        border-radius: 10px;

        min-width: 140px;

        height: 60px;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 0 12px;

        box-sizing: border-box;

        font-size: 20px;

        font-weight: bold;

        color: #222;
    }


    /* =====================================================
       AVISOS
    ===================================================== */

    footer .aviso {

        flex: 1;

        height: 65px;

        background: #eeeeee;

        border: 3px solid #aaa;

        border-radius: 5px;

        display: flex;

        align-items: center;

        justify-content: center;

        box-sizing: border-box;
    }


    footer .aviso p {

        margin: 0;

        font-size: 23px;

        font-weight: bold;

        color: #222;

        text-align: center;
    }


    /* =====================================================
       RESPONSIVIDADE
    ===================================================== */

    @media (max-width: 1200px) {

        #cardapio .container {

            column-gap: 50px;

        }

        #cardapio article h3 {

            width: 230px;

            font-size: 25px;
        }

        #cardapio article p {

            font-size: 32px;
        }

    }


    @media (max-width: 900px) {

        #cardapio .container {

            grid-template-columns: repeat(2, 1fr);

        }

        #cardapio .vazio {

            grid-column: 1 / 3;

        }

    }


    @media (max-width: 600px) {

        #cardapio .container {

            grid-template-columns: 1fr;

        }

        #cardapio .vazio {

            grid-column: 1;
        }

        footer {

            padding: 0 15px;

            gap: 10px;
        }

        footer .hora {

            min-width: 110px;

            font-size: 16px;
        }

        footer .aviso p {

            font-size: 17px;
        }

    }

</style>
</head>

<body>

    <header>

        <img class="logo" src="{% static 'img/logoif.png.png' %}" alt="Logo IFRS">

        <h1>CARDÁPIO DA SEMANA</h1>

    </header>

    <main id="cardapio">

        <div class="container">

            {% for item in cardapios %}

            <article>

                <h3>
                    {{ item.dia_semana }}
                </h3>

                <p>
                    {{ item.lanche }}
                </p>
            </article>


            {% empty %}

            <article>
                Nenhum cardápio cadastrado.
            </article>

            {% endfor %}

        </div>
    </main>



    <script>
        function atualizarHora() {
            const agora = new Date();

            document.getElementById("hora").innerHTML =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }

        setInterval(atualizarHora, 1000);
        atualizarHora();
    </script>

</body>

</html>
