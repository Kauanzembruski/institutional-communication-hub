<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Recuperação de Senha</title>

<style>
body{
    margin:0;
    background:#e5e5e5;
    font-family:Arial, Helvetica, sans-serif;
}

main{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

section{
    background:#0b6b2e;
    padding:30px;
    border-radius:10px;
    position:relative;
}

form{
    background:#2ea043;
    padding:40px;
    border-radius:25px;
    width:320px;
    text-align:center;
}

figure{
    width:70px;
    height:70px;
    background:#cfead6;
    border-radius:50%;
    margin:0 auto 20px auto;
}

p{
    color:white;
    font-size:13px;
    margin-bottom:20px;
}

label{
    color:white;
    font-size:13px;
    display:block;
    text-align:left;
}

input{
    width:100%;
    padding:8px;
    border:none;
    border-radius:3px;
    margin-top:3px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:8px;
    border:none;
    margin-top:8px;
    cursor:pointer;
}

.enviar{
    background:white;
}

.sec{
    background:#cfead6;
}

h1{
    position:absolute;
    top:-35px;
    left:0;
    color:#333;
    font-size:18px;
}

small{
    color:white;
    display:block;
    margin-top:10px;
}
</style>
</head>

<body>

<main>
<section>

<h1>Recuperação de senha</h1>

<form method="post">
    {% csrf_token %}

    <figure></figure>

    <p>
        Informe o e-mail cadastrado para recuperar sua senha.
    </p>

    <label for="id_email">
        E-mail:
    </label>

    {{ form.email }}

    {% if form.email.errors %}
        <small>
            {{ form.email.errors }}
        </small>
    {% endif %}

    <button type="submit" class="enviar">
        ENVIAR
    </button>

    <button type="button" class="sec" onclick="window.location.href='{% url 'login' %}'">
        VOLTAR
    </button>
</form>

</section>
</main>

</body>
</html>
