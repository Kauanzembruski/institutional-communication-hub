{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            linear-gradient(90deg, rgba(5,45,22,.92), rgba(5,45,22,.62)),
            url("{% static 'img/fundo.jpg' %}") center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 24px;
        padding: 42px;
        text-align: center;
        box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .icon {
        width: 82px;
        height: 82px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #eef8f1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 38px;
    }

    h1 {
        margin: 0 0 14px;
        color: #12351f;
        font-size: 30px;
    }

    p {
        color: #66756b;
        line-height: 1.7;
        margin: 0;
        font-size: 15px;
    }

    .info {
        margin-top: 24px;
        padding: 16px;
        background: #f7faf8;
        border: 1px solid #e3ebe6;
        border-radius: 12px;
        font-size: 14px;
        color: #546158;
    }

    .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin-top: 28px;
        width: 100%;
        height: 50px;
        border-radius: 12px;
        background: #0b6b2e;
        color: white;
        text-decoration: none;
        font-weight: 700;
        transition: .2s;
    }

    .btn:hover {
        background: #084d23;
    }
</style>
```

</head>

<body>

<div class="card">

```
<div class="icon">
    ✉️
</div>

<h1>E-mail enviado</h1>

<p>
    Se existir uma conta vinculada ao endereço informado,
    você receberá um e-mail com as instruções para redefinir sua senha.
</p>

<div class="info">
    Verifique também sua caixa de spam ou lixo eletrônico.
</div>

<a href="{% url 'login' %}" class="btn">
    Voltar para o login
</a>
```

</body>
