{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Senha alterada</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            linear-gradient(90deg, rgba(5,45,22,.92), rgba(5,45,22,.62)),
            url("{% static 'img/fundo.jpg' %}") center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 24px;
        padding: 42px;
        text-align: center;
        box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #eef8f1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 42px;
    }

    h1 {
        margin: 0 0 16px;
        color: #12351f;
        font-size: 30px;
    }

    p {
        margin: 0;
        color: #66756b;
        font-size: 15px;
        line-height: 1.7;
    }

    .success-box {
        margin-top: 24px;
        padding: 16px;
        background: #f7faf8;
        border: 1px solid #e3ebe6;
        border-radius: 12px;
        color: #546158;
        font-size: 14px;
    }

    .btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 52px;
        margin-top: 28px;
        border-radius: 12px;
        background: #0b6b2e;
        color: white;
        text-decoration: none;
        font-weight: 700;
        transition: .2s;
    }

    .btn:hover {
        background: #084d23;
    }
</style>
```

</head>

<body>

<div class="card">

```
<div class="icon">
    ✅
</div>

<h1>Senha alterada</h1>

<p>
    Sua senha foi redefinida com sucesso.
    Agora você já pode acessar sua conta utilizando a nova senha cadastrada.
</p>

<div class="success-box">
    Por segurança, mantenha sua senha em local seguro e não compartilhe suas credenciais com terceiros.
</div>

<a href="{% url 'login' %}" class="btn">
    Entrar no sistema
</a>
```

</div>

</body>
</html>
