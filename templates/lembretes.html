{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <title>Lembretes</title>

    <style>
        header {
            background: #7F549D;
        }


        main {
            grid-template-columns: repeat(2, 1fr);
        }

        article {
            background: #f8f8f8;
            border: 5px solid #9B6CC0;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            min-height: 240px;
        }

        .grande {
            grid-column: 1 / 3;
            min-height: 165px;
        }

        article h2 {
            font-size: 30px;
            color: #222;
            font-weight: bold;
        }

        .descricao {
            margin-top: 2%;
            font-size: 30px;
            color: #222;
            text-align: center;
            align-items: center;
            font-style: italic;
        }

        .data {
            font-size: 30px;
            color: #222;
            position: absolute;
            bottom: 25px;
            /* Distância da borda de baixo, alinhado com o padding */
            left: 25px;
            /* Distância da borda esquerda, alinhado com o padding */
            margin: 0;
        }
    </style>
</head>

<body>

    <header>

        <img class="logo" src="{% static 'img/logoif.png.png' %}" alt="Logo IFRS">

        <h1>LEMBRETES</h1>

    </header>


    <main>

        {% for lembrete in lembretes %}

        <article class="{% if forloop.first %}grande{% endif %}">

            <h2>
                {{ lembrete.titulo_lembrete }}
            </h2>


            {% if lembrete.conteudo_lembrete %}

            <p class="descricao">
                {{ lembrete.conteudo_lembrete }}
            </p>

            {% endif %}


            <p class="data">


                {{ lembrete.data_expi }}

            </p>

        </article>


        {% empty %}

        <div class="vazio">

            Nenhum lembrete cadastrado.

        </div>

        {% endfor %}

    </main>



    <script>

        function atualizarHora() {

            const agora = new Date();

            document.getElementById("hora").innerHTML =

                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        setInterval(atualizarHora, 1000);

        atualizarHora();

    </script>

</body>

</html>
