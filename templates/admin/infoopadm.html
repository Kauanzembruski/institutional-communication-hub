{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informações Operacionais</title>
<link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">


<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    margin: 0;
}

/* HEADER */
nav {
    height: 78px;
    background: #929292;
    padding: 0 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.login {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

/* LAYOUT */
.conteudo {
    display: flex;
    align-items: flex-start;
    gap: 40px;
    width: 100%;
    margin: 0;
    padding: 18px 18px 40px 42px;
}

.container {
    flex: 1 1 auto;
    min-width: 0;
}

/* LINHA + CARD */
.card-linha {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    width: 100%;
}

.card-linha > input[type="radio"] {
    margin: 0;
    flex: 0 0 auto;
}

.card {
    background: #666666;
    color: white;
    border-radius: 10px;
    width: 100%;
    min-height: 102px;
    padding: 22px 35px;
    cursor: pointer;
}

.card-header,
.card-body {
    display: grid;
    grid-template-columns: 1.5fr 4fr 2fr;
    gap: 20px;
    align-items: center;
}

.card-header {
    font-size: 13px;
    color: #f0f0f0;
    margin-bottom: 22px;
}

.card-body {
    font-size: 15px;
}

.card-header span,
.card-body span {
    text-align: center;
}

.card-body span:first-child {
    font-weight: bold;
}

.card-body span:nth-child(2) {
    text-decoration: underline;
}

/* PESQUISA AVANÇADA */
aside {
    flex: 0 0 500px;
    width: 500px;
    background: #e9e9e9;
    padding: 30px 20px 18px;
    border-radius: 12px;
}

aside h1 {
    margin: 0 0 34px 0;
    font-size: 31px;
    line-height: 1.05;
    color: #000;
    white-space: nowrap;
}

aside form {
    display: flex;
    flex-direction: column;
}

aside label {
    margin: 0 0 12px 0;
    font-size: 16px;
    color: #000;
}

aside input,
aside select {
    width: 100%;
    height: 37px;
    padding: 8px 10px;
    margin: 0 0 22px 0;
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    background: #fff;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

aside .pesquisar {
    width: 100%;
    height: 33px;
    border: none;
    border-radius: 7px;
    background: #3949ab;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    margin-top: 0;
}

aside .limpar-wrapper {
    display: none;
}

/* BOTÃO + */
.btn-add {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 61px;
    height: 61px;
    border-radius: 50%;
    border: none;
    background: #a8aab5;
    color: white;
    font-size: 35px;
    cursor: pointer;
    z-index: 1000;
}

/* MODAIS */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-box,
#edicao {
    background: #fff;
    width: 380px;
    max-width: 95%;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.18);
}

#edicao {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1001;
}

.modal-box h3,
#edicao h3 {
    margin-top: 0;
}

.modal-box label,
#edicao label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
}

.modal-box input,
.modal-box select,
#edicao input,
#edicao select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.modal-box button,
#edicao button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #a8aab5;
    color: #fff;
    cursor: pointer;
}

#edicao button:nth-of-type(2) {
    background: #d62828;
}

@media (max-width: 1100px) {
    .conteudo {
        gap: 20px;
        padding-left: 20px;
    }

    aside {
        flex-basis: 360px;
        width: 360px;
    }

    aside h1 {
        white-space: normal;
    }
}

@media (max-width: 800px) {
    .conteudo {
        flex-direction: column;
        padding: 20px;
    }

    aside {
        width: 100%;
        flex-basis: auto;
    }
}
</style>

</head>

<body>

<header>
 <nav class="inicial">
    <a href="{% url 'painel' %}">Voltar</a>
<img class="login"
         src="{% static 'img/login.png' %}"
         alt="Usuário">
 </nav>
</header>

<form style="display: none;">
  {% csrf_token %}
</form>

<div class="conteudo">

<div class="container" id="container">

  {% for item in infos %}

  <article class="card-linha" data-id="{{ item.id_info }}">

    <input type="radio"
           name="info"
           onclick="abrirEdicao(this)">

    <article class="card">

      <header class="card-header">
        <span>DATA</span>
        <span>EDITAL</span>
        <span>CATEGORIA</span>
      </header>

      <section class="card-body">
        <span>{{ item.data_lancamento|date:"d/m/Y" }}</span>
        <span>{{ item.titulo }}</span>
        <span>{{ item.categoria }}</span>
      </section>

    </article>

  </article>

  {% empty %}

  <h3>Nenhuma informação cadastrada.</h3>

  {% endfor %}

</div>


<aside>
    <form method="GET">
        <h1>Pesquisa Avançada</h1>

        <label>Edital (Título/Descrição):</label>
        <input
            type="text"
            name="titulo"
            value="{{ titulo|default:'' }}"
        >

        <label>Data de Lançamento:</label>
        <input
            type="date"
            name="data"
            value="{{ data|default:'' }}"
        >

        <label>Categoria:</label>
        <select name="categoria">
            <option value="">Todas as Categorias</option>

            <option value="Ensino"
                {% if categoria == "Ensino" %}selected{% endif %}>
                Ensino
            </option>

            <option value="Pesquisa"
                {% if categoria == "Pesquisa" %}selected{% endif %}>
                Pesquisa
            </option>

            <option value="Extensão"
                {% if categoria == "Extensão" %}selected{% endif %}>
                Extensão
            </option>
        </select>

        <button class="pesquisar" type="submit">
            Pesquisar
        </button>
    </form>
</aside>


</div>

<section id="edicao" data-admin-close="fecharModalEditar" data-admin-submit="salvar">

  <h3>Editar</h3>

  <label>Data de lançamento:</label>
  <input type="date" id="editData">

  <br><br>

  <label>Título:</label>
  <input type="text" id="editTitulo">

  <br><br>

  <label>Categoria:</label>
  <select id="editCategoria">
    <option>Ensino</option>
    <option>Pesquisa</option>
    <option>Extensão</option>
  </select>

  <br><br>

  <button onclick="salvar()">Salvar</button>

  <button onclick="excluirItem()">Excluir</button>

  <button onclick="fecharModalEditar()">Cancelar</button>

</section>

<button class="btn-add" onclick="abrirModal()">+</button>

<section id="modal" class="modal" data-admin-close="fecharModal">

  <article class="modal-box">

    <h3>Nova Informação</h3>

    <form onsubmit="criar(event)">

      <label>Data de lançamento:</label>
      <input type="date" id="novaData" required>

      <br><br>

      <label>Título:</label>
      <input type="text"
             id="novoTitulo"
             placeholder="Título"
             required>

      <br><br>

      <label>Categoria:</label>
      <select id="novaCategoria">
        <option>Ensino</option>
        <option>Pesquisa</option>
        <option>Extensão</option>
      </select>

      <br><br>

      <button type="submit">Adicionar</button>

      <button type="button" onclick="fecharModal()">Cancelar</button>

    </form>

  </article>

</section>

<script>

let atual = null;

function getCSRFToken() {
  const input = document.querySelector("[name=csrfmiddlewaretoken]");

  if (input) {
    return input.value;
  }

  return getCookie("csrftoken");
}

function escapeHTML(valor) {
  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function bloquearDatasPassadas() {
  let hoje = new Date();
  hoje.setHours(0,0,0,0);

  let ano = hoje.getFullYear();
  let mes = String(hoje.getMonth() + 1).padStart(2,"0");
  let dia = String(hoje.getDate()).padStart(2,"0");

  let minimo = `${ano}-${mes}-${dia}`;

  document.getElementById("novaData").min = minimo;
  document.getElementById("editData").min = minimo;
}

function validarData(data) {
  let hoje = new Date();
  hoje.setHours(0,0,0,0);

  let dataEscolhida = new Date(data);

  return dataEscolhida >= hoje;
}

function abrirEdicao(radio) {
  atual = radio.parentElement;

  let dados = atual.querySelectorAll(".card-body span");

  document.getElementById("editData").value =
    formatarData(dados[0].innerText.trim());

  document.getElementById("editTitulo").value =
    dados[1].innerText.trim();

  document.getElementById("editCategoria").value =
    dados[2].innerText.trim();

  document.getElementById("edicao").style.display = "block";
}

function fecharModalEditar() {
  document.getElementById("edicao").style.display = "none";
}

async function salvar() {
  let id = atual.dataset.id;

  let data = document.getElementById("editData").value;
  let titulo = document.getElementById("editTitulo").value;
  let categoria = document.getElementById("editCategoria").value;

  if (!validarData(data)) {
    alert("Não é permitido usar datas passadas.");
    return;
  }

  let resposta = await fetch(`/infoopadm/editar/${id}/`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCSRFToken()
    },
    body: JSON.stringify({
      data: data,
      titulo: titulo,
      categoria: categoria
    })
  });

  if (resposta.ok) {
    let dados = atual.querySelectorAll(".card-body span");

    dados[0].innerText = formatarDataBR(data);
    dados[1].innerText = titulo;
    dados[2].innerText = categoria;

    fecharModalEditar();
  }
}

async function excluirItem() {
  let id = atual.dataset.id;

  let resposta = await fetch(`/infoopadm/excluir/${id}/`, {
    method: "POST",
    headers: {
      "X-CSRFToken": getCSRFToken()
    }
  });

  if (resposta.ok) {
    atual.remove();
    fecharModalEditar();
  }
}

function abrirModal() {
  document.getElementById("modal").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modal").style.display = "none";
}

async function criar(e) {
  e.preventDefault();

  let data = document.getElementById("novaData").value;
  let titulo = document.getElementById("novoTitulo").value;
  let categoria = document.getElementById("novaCategoria").value;

  if (!validarData(data)) {
    alert("Não é permitido adicionar datas passadas.");
    return;
  }

  let resposta = await fetch("/infoopadm/criar/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCSRFToken()
    },
    body: JSON.stringify({
      data: data,
      titulo: titulo,
      categoria: categoria
    })
  });

  if (!resposta.ok) {
    alert("Erro ao criar informação.");
    return;
  }

  let retorno = await resposta.json();

  let article = document.createElement("article");

  article.className = "card-linha";
  article.dataset.id = retorno.id;

  article.innerHTML = `
    <input
    type="radio"
    name="info"
    onclick="abrirEdicao(this)">

    <article class="card">

      <header class="card-header">
        <span>DATA</span>
        <span>EDITAL</span>
        <span>CATEGORIA</span>
      </header>

      <section class="card-body">
        <span>${escapeHTML(formatarDataBR(data))}</span>
        <span>${escapeHTML(titulo)}</span>
        <span>${escapeHTML(categoria)}</span>
      </section>

    </article>
  `;

  document.getElementById("container").appendChild(article);

  fecharModal();

  document.getElementById("novaData").value = "";
  document.getElementById("novoTitulo").value = "";
  document.getElementById("novaCategoria").selectedIndex = 0;
}

function formatarDataBR(data) {
  let p = data.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}

function formatarData(data) {
  let p = data.split("/");
  return `${p[2]}-${p[1]}-${p[0]}`;
}

function getCookie(nome) {
  let cookieValor = null;

  if (document.cookie && document.cookie !== '') {
    let cookies = document.cookie.split(';');

    for (let i = 0; i < cookies.length; i++) {
      let cookie = cookies[i].trim();

      if (cookie.substring(0, nome.length + 1) === (nome + '=')) {
        cookieValor = decodeURIComponent(
          cookie.substring(nome.length + 1)
        );
        break;
      }
    }
  }

  return cookieValor;
}

bloquearDatasPassadas();

</script>

<script src="{% static 'js/admin-interacoes.js' %}" defer></script>
</body>
</html>
