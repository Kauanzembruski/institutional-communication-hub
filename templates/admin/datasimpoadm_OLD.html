{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Datas Importantes</title>
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #929292;
        }

        nav {
            background: #929292;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .pesquisa {
            width: 300px;
            padding: 10px;
            border: none;
            border-radius: 8px;
        }

        .login {
            width: 40px;
        }

        .calendar {
            width: 90%;
            margin: 20px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            text-transform: capitalize;
            color: #ffffff;
        }

        button {
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #272727;
            color: white;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #ddd;
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
        }

        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .date {
            background: white;
            min-height: 140px;
            padding: 5px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .date:hover {
            background: #f0f8ff;
        }

        .number {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .event {
            margin-top: 5px;
            font-size: 12px;
            background: lightgreen;
            padding: 5px;
            border-radius: 5px;
        }

        .event strong {
            display: block;
        }

        .past {
            background: #e0e0e0;
            color: #888;
        }

        .today {
            border: 2px solid rgb(22, 22, 31);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 12px;
            position: relative;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .modal-content textarea {
            resize: none;
            height: 100px;
        }

        .modal-content button {
            margin-top: 10px;
            width: 100%;
        }

        .fechar {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 22px;
        }

        .excluir {
            background: #d62828;
        }

        .listaEventos {
            margin-top: 15px;
            max-height: 200px;
            overflow: auto;
        }

        .itemEvento {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .itemEvento button {
            width: auto;
            margin-right: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <nav class="inicial">
            <a href="{% url 'painel' %}">Voltar</a>

            <input class="pesquisa" type="text" placeholder="Pesquise aqui...">

            <img class="login" src="{% static 'img/login.png' %}" alt="Usuário">
        </nav>
    </header>

    <div class="calendar">

        <div class="header">
            <button onclick="prevMonth()">◀</button>
            <h2 id="monthYear"></h2>
            <button onclick="nextMonth()">▶</button>
        </div>

        <div class="days">
            <div>Dom</div>
            <div>Seg</div>
            <div>Ter</div>
            <div>Qua</div>
            <div>Qui</div>
            <div>Sex</div>
            <div>Sáb</div>
        </div>

        <div class="dates" id="dates"></div>

    </div>

    <div class="modal" id="modal">

        <div class="modal-content">

            <span class="fechar" onclick="fecharModal()">&times;</span>

            <h2>Eventos do Dia</h2>

            <input type="text" id="titulo" placeholder="Título">

            <textarea id="descricao" placeholder="Descrição"></textarea>

            <button onclick="salvarData()" id="btnSalvar">
                Salvar Evento
            </button>

            <div class="listaEventos" id="listaEventos"></div>

        </div>

    </div>

    {{ datas|json_script:"datas-banco" }}

    <script>
        let currentDate = new Date();
        let diaSelecionado = null;
        let idEditando = null;

        let datasBanco = JSON.parse(
            document.getElementById("datas-banco").textContent
        );

        function escapeHTML(valor) {
            return String(valor ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderCalendar() {
            const datesContainer = document.getElementById("dates");
            const monthYear = document.getElementById("monthYear");

            datesContainer.innerHTML = "";

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            monthYear.innerText = currentDate.toLocaleString("pt-BR", {
                month: "long",
                year: "numeric"
            });

            for (let i = 0; i < firstDay; i++) {
                datesContainer.innerHTML += `<div></div>`;
            }

            for (let day = 1; day <= lastDate; day++) {
                const dateObj = new Date(year, month, day);

                let classes = "date";

                if (dateObj < today) {
                    classes += " past";
                }

                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {
                    classes += " today";
                }

                const dataFormatada =
                    `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                let datas = datasBanco.filter(data => {
                    return data.data === dataFormatada;
                });

                let htmlDatas = "";

                datas.forEach(data => {
                    htmlDatas += `
                        <div class="event">
                            <strong>${escapeHTML(data.titulo)}</strong>
                            ${escapeHTML(data.descricao)}
                        </div>
                    `;
                });

                datesContainer.innerHTML += `
                    <div class="${classes}" onclick="abrirModal('${dataFormatada}')">
                        <div class="number">${day}</div>
                        ${htmlDatas}
                    </div>
                `;
            }
        }

        function abrirModal(data) {
            diaSelecionado = data;
            idEditando = null;

            document.getElementById("titulo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("btnSalvar").innerText = "Salvar Evento";

            document.getElementById("modal").style.display = "flex";

            carregarDatas();
        }

        function fecharModal() {
            document.getElementById("modal").style.display = "none";

            idEditando = null;
            document.getElementById("titulo").value = "";
            document.getElementById("descricao").value = "";
            document.getElementById("btnSalvar").innerText = "Salvar Evento";
        }

        function salvarData() {
            let titulo = document.getElementById("titulo").value;
            let descricao = document.getElementById("descricao").value;

            if (titulo.trim() === "") {
                alert("Digite um título");
                return;
            }

            let url = "/datasimport/salvar-data/";

            if (idEditando !== null) {
                url = `/datasimport/editar-data/${idEditando}/`;
            }

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: new URLSearchParams({
                    titulo: titulo,
                    descricao: descricao,
                    data: diaSelecionado
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                });
        }

        function carregarDatas() {
            let lista = document.getElementById("listaEventos");

            lista.innerHTML = "";

            let datas = datasBanco.filter(data => {
                return data.data === diaSelecionado;
            });

            datas.forEach(data => {
                lista.innerHTML += `
                    <div class="itemEvento">

                        <strong>${escapeHTML(data.titulo)}</strong>

                        <p>${escapeHTML(data.descricao)}</p>

                        <button onclick="editarData(${Number(data.id)})">
                            Editar
                        </button>

                        <button class="excluir" onclick="excluirData(${Number(data.id)})">
                            Excluir
                        </button>

                    </div>
                `;
            });
        }

        function editarData(id) {
            let dataEncontrada = datasBanco.find(data => {
                return Number(data.id) === Number(id);
            });

            if (!dataEncontrada) return;

            idEditando = id;

            document.getElementById("titulo").value = dataEncontrada.titulo;
            document.getElementById("descricao").value = dataEncontrada.descricao;
            document.getElementById("btnSalvar").innerText = "Salvar Alteração";
        }

        function excluirData(id) {
            fetch(`/datasimport/excluir-data/${Number(id)}/`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                });
        }

        function prevMonth() {
            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();
        }

        renderCalendar();
    </script>

</body>

</html>
