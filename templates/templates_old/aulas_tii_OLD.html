{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Próximas Aulas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#e6e6e6;
}

/* CONTAINER */

main{
    width:95%;
    height:calc(100vh - 30px);
    margin:15px auto;
    background:#f5f5f5;
    padding:16px;
    position:relative;
}

/* CABEÇALHO */

.header{
    background:#b12d5d;
    height:66px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.logo{
    position:absolute;
    left:20px;
    height:32px;
    width:auto;
}

.header h1{
    color:white;
    font-size:32px;
    font-weight:900;
    letter-spacing:1px;
}

/* CURSO */

.curso{
    text-align:center;
    margin:25px 0 40px;
    font-size:28px;
    font-weight:900;
    color:#222;
}

/* LISTA DAS TURMAS */

.grid{
    width:86%;
    margin:auto;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.grid.duas-colunas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 48px;
}

/* CARD */

.card{
    height:72px;
    display:flex;
    background:white;
    border:1px solid #b12d5d;
}

/* TURMA */

.turma{
    width:110px;
    background:#981f4e;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:bold;

    clip-path:polygon(
        0 0,
        100% 0,
        72% 100%,
        0 100%
    );

    flex-shrink:0;
}

/* MATÉRIA */

.materia{
    flex:1;

    display:flex;
    align-items:center;

    padding-left:25px;

    font-size:18px;
    font-weight:bold;

    color:#222;
}

/* SALA */

.sala{
    width:120px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:bold;

    color:#222;

    flex-shrink:0;
}

/* VAZIO */

.vazio{
    text-align:center;
    color:#222;
    font-size:24px;
    font-weight:bold;
}

/* FOOTER */

footer{
    position:absolute;
    left:16px;
    right:16px;
    bottom:45px;

    display:flex;
    gap:30px;
    align-items:center;
}

.info{
    width:115px;
    height:32px;

    border:1px solid #b12d5d;
    border-radius:4px;

    color:#b12d5d;
    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* AVISOS */

.marquee{
    flex:1;

    height:32px;

    background:#b12d5d;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;

    overflow:hidden;
    position:relative;
}

.marquee p{
    position:absolute;
    white-space:nowrap;
    color:white;
    font-weight:bold;
    animation:rolar 12s linear infinite;
}

@keyframes rolar{
    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* RESPONSIVO */

@media(max-width:768px){
    html,
    body{
        overflow:auto;
    }

    main{
        height:auto;
        min-height:100vh;
        margin:0;
        width:100%;
        padding-bottom:100px;
    }

    .header h1{
        font-size:22px;
    }

    .curso{
        font-size:20px;
    }

    .grid{
        width:100%;
    }

    footer{
        position:fixed;
        left:15px;
        right:15px;
        bottom:15px;
        width:auto;
        flex-direction:column;
        gap:10px;
    }

    .info,
    .marquee{
        width:100%;
    }
}
</style>
</head>

<body>

<main>

    <div class="header">

        <img
        src="{% static 'img/logoif.png.png' %}"
        alt="Logo IFRS"
        class="logo">

        <h1>PRÓXIMAS AULAS</h1>

    </div>

    <h2 class="curso">
        TEC. EM INFORMÁTICA PARA INTERNET
    </h2>

    <div class="grid" id="tabelaAulas"></div>

    <footer>

        <div class="info">
            <span id="hora"></span>
            &nbsp;|&nbsp;
            <span>20°</span>
        </div>

        <div class="marquee">
            <p>
                {% for aviso in avisos %}

                    {{ aviso.titulo_aviso }}

                    {% if not forloop.last %}
                        • • •
                    {% endif %}

                {% empty %}

                    *AVISOS INSTITUCIONAIS

                {% endfor %}
            </p>
        </div>

    </footer>

</main>

<script>
async function carregarAulas(){

    const resposta = await fetch(
        "/pxaulas/api/proximas-aulas/TII/"
    );

    const retorno = await resposta.json();

    const tabela =
        document.getElementById("tabelaAulas");

    tabela.innerHTML = "";

    if(!retorno.dados || retorno.dados.length === 0){

        tabela.innerHTML = `
            <div class="vazio">
                Nenhuma próxima aula encontrada.
            </div>
        `;

        return;
    }

    retorno.dados.sort((a, b) => {

        return a.turma.localeCompare(
            b.turma,
            "pt-BR",
            {
                numeric:true,
                sensitivity:"base"
            }
        );

    });

    const possuiTurmaB = retorno.dados.some(item =>
        item.turma.toUpperCase().includes("B")
    );

    if(possuiTurmaB){
        tabela.classList.add("duas-colunas");
    }else{
        tabela.classList.remove("duas-colunas");
    }

    retorno.dados.forEach(item => {

        tabela.innerHTML += `
            <div class="card">

                <div class="turma">
                    ${item.turma}
                </div>

                <div class="materia">
                    ${item.materia}
                </div>

                <div class="sala">
                    ${item.sala}
                </div>

            </div>
        `;

    });

}

function atualizarHora(){

    const agora = new Date();

    document.getElementById("hora").innerHTML =
    agora.toLocaleTimeString(
        "pt-BR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

setInterval(atualizarHora,1000);
atualizarHora();

carregarAulas();
setInterval(carregarAulas,60000);
</script>

</body>

</html>
