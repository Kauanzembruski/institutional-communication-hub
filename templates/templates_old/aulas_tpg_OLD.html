{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Próximas Aulas - Processos Gerenciais</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e8e8e8;
        }

        /* CONTAINER */

        main {
            width: 95%;
            height: calc(100vh - 40px);
            margin: 20px auto;
            background: #f4f4f4;
            padding: 20px;
            position: relative;
        }

        /* TOPO */

        .topo {
            background: #2f5bab;
            color: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 2px;
        }

        .logo {
            position: absolute;
            left: 20px;
            height: 40px;
            width: auto;
        }

        .topo h1 {
            font-size: 40px;
            font-weight: 900;
        }

        /* CURSO */

        .curso {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #222;
            margin: 30px 0;
        }

        /* GRID */

        .grid {
            width: 70%;
            max-width: 900px;
            margin: auto;

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        /* CARD */

        .card {
            display: flex;
            border: 2px solid #2f5bab;
            background: white;
            height: 72px;
        }

        /* TURMA */

        .turma {
            width: 110px;
            background: #244d9a;
            color: white;
            font-size: 24px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            clip-path: polygon(0 0,
                    100% 0,
                    75% 100%,
                    0 100%);

            flex-shrink: 0;
        }

        /* MATÉRIA */

        .materia {
            flex: 1;

            display: flex;
            align-items: center;

            padding-left: 25px;

            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        /* SALA */

        .sala {
            width: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: bold;
            color: #222;

            flex-shrink: 0;
        }

        /* VAZIO */

        .vazio {
            text-align: center;
            color: #222;
            font-size: 24px;
            font-weight: bold;
        }

        /* FOOTER */

        footer {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 45px;

            display: flex;
            gap: 30px;
            align-items: center;

            background: #244d9a;
        }

        .info {
            width: 160px;
            height: 45px;

            background: #ffffff;

            border: 2px solid #2f5bab;
            border-radius: 6px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #2f5bab;
            font-size: 20px;
            font-weight: bold;
        }

        /* AVISOS */

        .marquee {
            flex: 1;
            height: 45px;

            overflow: hidden;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marquee p {
            position: absolute;
            white-space: nowrap;

            color: #ffffff;
            font-size: 20px;
            font-weight: bold;

            animation: rolar 30s linear infinite;
        }

        @keyframes rolar {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }

        /* RESPONSIVO */

        @media(max-width:768px) {

            html,
            body {
                overflow: auto;
            }

            main {
                width: 100%;
                height: auto;
                min-height: 100vh;
                margin: 0;
                padding-bottom: 120px;
            }

            .topo h1 {
                font-size: 25px;
            }

            .logo {
                height: 30px;
            }

            .curso {
                font-size: 20px;
            }

            .grid,
            .grid.duas-colunas {
                width: 100%;
                display: flex;
                flex-direction: column;
            }

            footer {
                position: fixed;
                left: 15px;
                right: 15px;
                bottom: 15px;
                width: auto;
                flex-direction: column;
                gap: 10px;
            }

            .info,
            .marquee {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main>

        <div class="topo">

            <img src="{% static 'img/logoif.png.png' %}" alt="Logo IFRS" class="logo">

            <h1>PRÓXIMAS AULAS</h1>

        </div>

        <div class="curso">
            PROCESSOS GERENCIAIS
        </div>

        <div class="grid" id="tabelaAulas"></div>

        <footer>

            <div class="info">
                <span id="hora"></span>
                &nbsp;|&nbsp;
                <span id="temperatura">20°</span>
            </div>

            <div class="marquee">

                <p>
                    {% for aviso in avisos %}

                    {{ aviso.titulo_aviso }}

                    {% if not forloop.last %}
                    • • •
                    {% endif %}

                    {% empty %}

                    *AVISOS INSTITUCIONAIS

                    {% endfor %}
                </p>

            </div>

        </footer>

    </main>

    <script>
        async function carregarAulas() {

            const resposta = await fetch(
                "/pxaulas/api/proximas-aulas/TPG/"
            );

            const retorno = await resposta.json();

            const tabela =
                document.getElementById("tabelaAulas");

            tabela.innerHTML = "";

            tabela.classList.remove("duas-colunas");

            if (!retorno.dados || retorno.dados.length === 0) {

                tabela.innerHTML = `
            <div class="vazio">
                Nenhuma próxima aula encontrada.
            </div>
        `;

                return;
            }

            retorno.dados.sort((a, b) => {

                const numeroA = parseInt(
                    String(a.turma).replace(/\D/g, "")
                );

                const numeroB = parseInt(
                    String(b.turma).replace(/\D/g, "")
                );

                return numeroA - numeroB;

            });

            retorno.dados.forEach(item => {

                tabela.innerHTML += `
            <div class="card">

                <div class="turma">
    ${String(item.turma)
                        .replace("A", "")
                        .replace("B", "")
                        .trim()}º
</div>

                <div class="materia">
                    ${item.materia}
                </div>

                <div class="sala">
                    ${item.sala}
                </div>

            </div>
        `;

            });
        }

        function atualizarHora() {

            const agora = new Date();

            document.getElementById("hora").innerHTML =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }

        setInterval(atualizarHora, 1000);
        atualizarHora();

        carregarAulas();
        setInterval(carregarAulas, 60000);
    </script>

</body>

</html>
